plugins {
    // 26.1 ships unobfuscated, so no mappings are needed
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Game version is appended so each jar shows which Minecraft it is for, e.g. 0.1.0+26.1.2
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Only the API to open the menu from Mod Menu; it is not bundled and not required at runtime.
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Core regression tests (no JUnit), run as part of ./gradlew build
tasks.register('coreTests', JavaExec) {
    group = 'verification'
    description = 'Combat Data core tests'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.combatdata.core.CoreTests'
    jvmArgs '-Dstdout.encoding=UTF-8'
}
tasks.named('check') { dependsOn 'coreTests' }

// No JUnit tests; without this Gradle 9 fails on the empty test task.
tasks.named('test') { enabled = false }
